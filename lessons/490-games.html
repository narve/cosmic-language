  <h2>A game of trust</h2>
  <p>Two players each choose, at the same time, to cooperate or to defect. Each gains most by defecting, yet both do better if both cooperate. This is the prisoner's dilemma, and it is pure mathematics: the rules, the strategies and their results can all be computed.</p>
