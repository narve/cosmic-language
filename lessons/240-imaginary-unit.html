  <h3>the imaginary unit</h3>
  <p>No real number squares to a negative number. The next two lessons add one that does, and the numbers built from it.</p>
  <p>New constant: <code>i</code>.</p>
  <pre><code>(= (× i i) (neg 1))  (= (^ i 2) (neg 1))  (= (^ i 3) (neg i))  (= (^ i 4) 1)
(= (^ (× 2 i) 2) (neg 4))  (= (× i (neg i)) 1)</code></pre>
